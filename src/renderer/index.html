<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NHD-TV Feasibility Host</title>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Milestone 0 · Feasibility</p>
      <h1>NHD-TV</h1>
      <p class="lede">
        Secure service-host spike for DRM, session, navigation, and performance testing.
      </p>

      <section class="status-card" aria-labelledby="runtime-title">
        <div>
          <p class="status-label" id="runtime-title">Runtime</p>
          <p id="runtime-status">Loading runtime information…</p>
        </div>
        <div>
          <p class="status-label">Widevine</p>
          <p id="widevine-status">Checking component status…</p>
        </div>
        <div>
          <p class="status-label">Active service</p>
          <p id="service-status">None</p>
        </div>
      </section>

      <section aria-labelledby="services-title">
        <p class="status-label" id="services-title">Service matrix</p>
        <div class="actions" id="service-actions"></div>
      </section>

      <button class="secondary close-service" id="close-service" type="button">
        Close active service
      </button>

      <p class="feedback" id="feedback" role="status"></p>
    </main>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
